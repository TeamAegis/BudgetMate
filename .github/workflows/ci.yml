name: CI

# Runs the full pre-PR gate on every PR and on pushes to main (architecture.md §10.4).
# Offline product → no secrets, no network beyond the Actions marketplace + apt/npm/crates.
#
# Split into two PARALLEL jobs so frontend feedback is fast and wall-clock = the slower job
# (not the sum). The rust job is the long pole on a COLD cache (it compiles bundled SQLCipher +
# vendored OpenSSL + Tauri from source); once main has a cached run, rust-cache restores those
# artifacts and it drops to ~1-2 min.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # GitHub's ubuntu image ships Google Chrome; karma-chrome-launcher reads CHROME_BIN.
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests (headless)
        run: npm test
      - name: Guards (no-network / no-telemetry / no-float-money)
        run: npm run guards
      # Production build is part of the gate: AOT/template/budget errors that unit tests don't hit
      # would otherwise slip through. It also produces dist/ for the size metric below.
      - name: Production build
        run: npm run build
      # Records the initial web payload (raw + gzip) to the run summary and fails on a budget
      # breach - the cold-start proxy (NFR-Perf2). The Android APK/AAB size (NFR-Perf1) is the
      # deferred job below.
      - name: Bundle size metric
        run: npm run size

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0 # better cache hits in CI; incremental is useless across fresh runners
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # Tauri Linux build deps (GTK/WebKit) + NASM for the bundled-SQLCipher vendored-OpenSSL
      # build (Perl is already on the runner). Required to compile the Rust core's tauri dep.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev \
            libayatana-appindicator3-dev patchelf nasm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Caches ~/.cargo (registry/git) AND src-tauri/target - including the expensive compiled
      # OpenSSL/SQLCipher artifacts. Saved after a successful job; PRs restore main's cache.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy (warnings = errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ── Deferred: Android bundle-size metric (issue #5) ──
  # The web initial-payload metric (cold-start proxy, NFR-Perf2) now runs in the `frontend` job
  # via `npm run size`. The INSTALL-size budget (NFR-Perf1: <=25 MB) is the Android APK/AAB, which
  # needs the Android SDK/NDK + signing - not wired yet (see issue #4 / run-app). Add a job here
  # that runs `npm run tauri android build` and reports the artifact size once Android tooling lands.
