name: CI

# Runs the full pre-PR gate on every PR and on pushes to main (architecture.md §10.4).
# Offline product → no secrets, no network beyond the Actions marketplace + apt/npm/crates.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    env:
      # GitHub's ubuntu image ships Google Chrome; karma-chrome-launcher reads CHROME_BIN.
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      # Tauri Linux build deps (GTK/WebKit) + NASM for the bundled-SQLCipher vendored-OpenSSL
      # build (Perl is already on the runner). Required to compile the Rust core's tauri dep.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev \
            libayatana-appindicator3-dev patchelf nasm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── The gate (same as the local pre-PR gate, CLAUDE.md / run-app) ──
      - name: Lint (Angular)
        run: npm run lint

      - name: Unit tests (Angular, headless)
        run: npm test

      - name: Guards (no-network / no-telemetry / no-float-money)
        run: npm run guards

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy (warnings = errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  # ── Deferred: Android bundle-size metric (issue #5) ──
  # Recording the APK/AAB size against the budget (NFR-Perf1: <=25 MB) needs the Android
  # SDK/NDK + signing, which aren't wired yet (see issue #4 / run-app). Add a job here that runs
  # `npm run tauri android build` and reports the artifact size once Android tooling lands.
