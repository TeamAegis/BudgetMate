<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BudgetMate</title>
    <base href="/" />
    <!--
      viewport-fit=cover for edge-to-edge; interactive-widget=resizes-content is a speculative hint
      (it does NOT affect the Android System WebView, so the visualViewport-based --keyboard-inset in
      core/layout/viewport-insets.service.ts + windowSoftInputMode=adjustResize remain the primary
      keyboard-aware mechanism - see .claude/rules/android.md).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!--
      Privacy CSP: no remote anything. Everything (fonts, scripts, styles, images) is bundled.
      The authoritative CSP for the packaged app is set in src-tauri/tauri.conf.json; this meta
      tag mirrors the intent for the browser dev preview. 'unsafe-inline' on style-src is
      required for Angular component styles.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: asset: http://asset.localhost; font-src 'self'; connect-src 'self' ipc: http://ipc.localhost ws://localhost:4200 http://localhost:4200; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ff7755" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
