<section class="feature-page">
  <div class="page-actions">
    <app-button variant="primary" (click)="addRecurring()" [disabled]="busy() || loading()">
      <svg icon lucidePlus [size]="18" aria-hidden="true"></svg>
      <span>Add</span>
    </app-button>
  </div>

  @if (error(); as err) {
    <app-banner>{{ err }}</app-banner>
  }

  @if (loading()) {
    <ul class="rows" aria-busy="true">
      @for (i of skeletonRows; track i) {
        <li class="skeleton-row">
          <app-skeleton variant="text" width="50%" />
          <app-skeleton variant="text" width="22%" />
        </li>
      }
    </ul>
  } @else if (rules().length === 0 && !error()) {
    <app-empty-state
      message="No recurring rules yet."
      cta="Add your first rule"
      (action)="addRecurring()"
    />
  } @else {
    <ul class="rows">
      @for (r of rules(); track r.id) {
        <li app-list-row [name]="ruleTitle(r)" [meta]="ruleMeta(r)" [class.paused]="!r.active">
          <span
            amount
            class="amount numeric"
            [class.income]="!isExpense(r)"
            [class.expense]="isExpense(r)"
            >{{ amountLabel(r) }}</span
          >
          <app-icon-button actions ariaLabel="Edit" (click)="editRecurring(r)" [disabled]="busy()">
            <svg lucidePencil [size]="18" aria-hidden="true"></svg>
          </app-icon-button>
          @if (r.active) {
            <app-icon-button actions ariaLabel="Pause" (click)="toggleActive(r)" [disabled]="busy()">
              <svg lucidePause [size]="18" aria-hidden="true"></svg>
            </app-icon-button>
          } @else {
            <app-icon-button actions ariaLabel="Resume" (click)="toggleActive(r)" [disabled]="busy()">
              <svg lucidePlay [size]="18" aria-hidden="true"></svg>
            </app-icon-button>
          }
        </li>
      }
    </ul>
  }
</section>
