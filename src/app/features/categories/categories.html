<section class="feature-page">
  @if (!showForm()) {
    <div class="page-actions">
      <app-button variant="primary" (click)="startCreate()" [disabled]="busy()">
        <svg icon lucidePlus [size]="18"></svg>
        <span>Add</span>
      </app-button>
    </div>
  }

  @if (error(); as err) {
    <app-banner>{{ err }}</app-banner>
  }

  @if (showForm()) {
    <app-card>
      <form class="form" [formGroup]="form" (ngSubmit)="save()">
        <app-form-field label="Name">
          <input type="text" formControlName="name" placeholder="e.g. Groceries" />
        </app-form-field>
        <app-form-field label="Kind">
          <select formControlName="kind">
            @for (k of kinds; track k) {
              <option [value]="k">{{ k }}</option>
            }
          </select>
        </app-form-field>
        <app-form-field label="Parent (optional)">
          <select formControlName="parentId">
            <option [ngValue]="null">— None —</option>
            @for (p of parentOptions(); track p.id) {
              <option [ngValue]="p.id">{{ p.name }}</option>
            }
          </select>
        </app-form-field>
        <div class="actions">
          <app-button variant="ghost" (click)="cancel()" [disabled]="busy()">Cancel</app-button>
          <app-button type="submit" variant="primary" [disabled]="busy() || form.invalid">
            {{ busy() ? 'Saving…' : 'Save' }}
          </app-button>
        </div>
      </form>
    </app-card>
  }

  @if (loading()) {
    <p class="muted">Loading…</p>
  } @else if (!showForm() && categories().length === 0 && !error()) {
    <app-empty-state
      message="No categories yet."
      cta="Add your first category"
      (action)="startCreate()"
    />
  } @else {
    <ul class="rows">
      @for (c of categories(); track c.id) {
        <li app-list-row [name]="c.name" [meta]="c.kind + ' · parent: ' + parentName(c.parentId)">
          <app-icon-button actions ariaLabel="Edit" (click)="startEdit(c)" [disabled]="busy()">
            <svg lucidePencil [size]="18"></svg>
          </app-icon-button>
          <app-icon-button actions ariaLabel="Archive" (click)="archive(c)" [disabled]="busy()">
            <svg lucideArchive [size]="18"></svg>
          </app-icon-button>
        </li>
      }
    </ul>
  }
</section>
