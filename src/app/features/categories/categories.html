<section class="feature-page">
  <!-- Add lives in the thumb-zone FAB (one convention for every list); it yields to the empty
       state's single CTA so there is never a doubled affordance. -->
  @if (loading() || categories().length > 0 || error()) {
    <app-fab ariaLabel="Add category" (action)="addCategory()" />
  }

  @if (error(); as err) {
    <app-banner>{{ err }}</app-banner>
  }

  @if (loading()) {
    <ul class="rows" aria-busy="true">
      @for (i of skeletonRows; track i) {
        <li class="skeleton-row">
          <app-skeleton variant="text" width="50%" />
          <app-skeleton variant="text" width="18%" />
        </li>
      }
    </ul>
  } @else if (categories().length === 0 && !error()) {
    <app-empty-state
      message="No categories yet."
      cta="Add your first category"
      (action)="addCategory()"
    />
  } @else {
    <ul class="rows">
      @for (c of categories(); track c.id; let i = $index) {
        <li
          app-list-row
          animate.enter="list-item-enter"
          [style.animation-delay]="(i < 12 ? i * 40 : 0) + 'ms'"
          [name]="c.name"
          [meta]="metaLine(c)"
        >
          <app-icon-button actions ariaLabel="Edit" (click)="editCategory(c)">
            <svg lucidePencil [size]="18" aria-hidden="true"></svg>
          </app-icon-button>
        </li>
      }
    </ul>
  }
</section>
