<section class="form-page">
  @if (error(); as err) {
    <app-banner>{{ err }}</app-banner>
  }

  @if (loading()) {
    <div class="form-loading" aria-busy="true">
      <app-spinner [size]="28" label="Loading" />
    </div>
  } @else {
    <!-- Save lives in the app header (keyboard-safe); ngSubmit keeps Enter-to-save working. -->
    <form class="form-body" [formGroup]="form" (ngSubmit)="save()">
      <app-form-field label="Name" [error]="nameError()">
        <input type="text" formControlName="name" placeholder="e.g. Groceries" />
      </app-form-field>

      <app-form-field label="Kind">
        <app-select-field
          ariaLabel="Kind"
          [options]="kindOptions"
          [value]="form.controls.kind.value"
          (valueChange)="setKind($event)"
        />
      </app-form-field>

      <app-form-field label="Parent (optional)">
        <app-select-field
          ariaLabel="Parent category"
          [options]="parentOptions()"
          [value]="parentValue()"
          (valueChange)="setParent($event)"
        />
      </app-form-field>
    </form>

    <app-form-actions [loading]="busy()" (save)="save()" />
  }

  @if (confirmingArchive()) {
    <app-confirm-dialog
      title="Archive this category?"
      [message]="
        'Archive \'' + form.controls.name.value + '\'? It will be hidden from pickers but not deleted.'
      "
      confirmLabel="Archive"
      [busy]="busy()"
      (confirm)="archiveConfirmed()"
      (cancelled)="confirmingArchive.set(false)"
    />
  }
</section>
