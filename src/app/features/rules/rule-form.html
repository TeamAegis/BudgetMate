<section class="form-page">
  @if (error(); as err) {
    <app-banner>{{ err }}</app-banner>
  }

  @if (loading()) {
    <div class="form-loading" aria-busy="true">
      <app-spinner [size]="28" label="Loading" />
    </div>
  } @else {
    <!-- Save lives in the app header (keyboard-safe); ngSubmit keeps Enter-to-save working. -->
    <form class="form-body" [formGroup]="form" (ngSubmit)="save()">
      <!-- The rule reads as a sentence: "When the payee name contains uber, set the category to
           Transport." Same controls and stored values as before - only the words changed. -->
      <p class="form-line">When</p>
      <app-form-field label="Look at">
        <app-select-field
          ariaLabel="Look at"
          [options]="fieldOptions"
          [value]="form.controls.matchField.value"
          (valueChange)="setMatchField($event)"
        />
      </app-form-field>
      <app-form-field label="Match">
        <app-select-field
          ariaLabel="Match"
          [options]="opOptions"
          [value]="form.controls.matchOp.value"
          (valueChange)="setMatchOp($event)"
        />
      </app-form-field>
      <app-form-field label="This text" [error]="matchValueError()">
        <input type="text" formControlName="matchValue" placeholder="e.g. uber" />
      </app-form-field>

      <p class="form-line">Then set</p>
      <app-form-field label="Change">
        <app-select-field
          ariaLabel="Change"
          [options]="fieldOptions"
          [value]="form.controls.setField.value"
          (valueChange)="setSetField($event)"
        />
      </app-form-field>
      @if (form.controls.setField.value === 'category') {
        <!-- Picking from existing categories prevents a silently misspelled name (the stored
             value is the same string a correct free-text entry would have carried). -->
        <app-form-field label="To" [error]="setValueError()">
          <app-select-field
            ariaLabel="To category"
            [options]="setValueOptions()"
            [value]="form.controls.setValue.value"
            (valueChange)="setSetValue($event)"
          />
        </app-form-field>
      } @else {
        <app-form-field label="To" [error]="setValueError()">
          <input type="text" formControlName="setValue" placeholder="e.g. Transport" />
        </app-form-field>
      }
    </form>

    <app-form-actions [loading]="busy()" (save)="save()" />
  }

  @if (confirmingDelete()) {
    <app-confirm-dialog
      title="Delete rule?"
      message="This removes the rule from the engine. Existing transactions keep their categories."
      confirmLabel="Delete"
      [busy]="busy()"
      (confirm)="deleteConfirmed()"
      (cancelled)="confirmingDelete.set(false)"
    />
  }
</section>
