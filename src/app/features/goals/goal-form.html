<section class="form-page">
  @if (error(); as err) {
    <app-banner>{{ err }}</app-banner>
  }

  @if (loading()) {
    <div class="form-loading" aria-busy="true">
      <app-spinner [size]="28" label="Loading" />
    </div>
  } @else {
    <!-- Save lives in the app header (keyboard-safe); ngSubmit keeps Enter-to-save working. -->
    <form class="form-body" [formGroup]="form" (ngSubmit)="save()">
      <app-form-field label="Name" [error]="nameError()">
        <input type="text" formControlName="name" placeholder="e.g. Vacation" />
      </app-form-field>

      <!-- Target + currency side by side (currency is a compact fixed-width field). -->
      <div class="amount-row">
        <app-form-field label="Target" class="grow" [error]="targetError()">
          <input type="text" inputmode="decimal" formControlName="target" placeholder="0.00" class="numeric" />
        </app-form-field>
        <app-form-field label="Currency" class="currency-field" [error]="currencyError()">
          <input type="text" formControlName="currency" maxlength="3" class="numeric currency" />
        </app-form-field>
      </div>

      <app-form-field
        label="Saved so far"
        hint="How much you've put aside toward this goal."
        [error]="currentError()"
      >
        <input type="text" inputmode="decimal" formControlName="current" placeholder="0.00" class="numeric" />
      </app-form-field>

      <app-form-field label="Target date (optional)">
        <input type="date" formControlName="targetDate" />
      </app-form-field>

      @if (editing()) {
        <div class="danger-zone">
          <app-button variant="danger" (click)="confirmingDelete.set(true)" [disabled]="busy()" [block]="true">
            <svg icon lucideTrash2 [size]="18"></svg>
            <span>Delete goal</span>
          </app-button>
        </div>
      }
    </form>
  }

  @if (confirmingDelete()) {
    <app-confirm-dialog
      title="Delete goal?"
      message="This permanently removes the goal. This can't be undone."
      confirmLabel="Delete"
      [busy]="busy()"
      (confirm)="deleteConfirmed()"
      (cancelled)="confirmingDelete.set(false)"
    />
  }
</section>
