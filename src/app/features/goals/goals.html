<section class="feature-page">
  <app-fab ariaLabel="Add goal" (action)="addGoal()" />

  @if (error(); as err) {
    <app-banner>{{ err }}</app-banner>
  }

  @if (loading()) {
    <ul class="rows" aria-busy="true">
      @for (i of skeletonRows; track i) {
        <li><app-skeleton variant="block" height="84px" /></li>
      }
    </ul>
  } @else if (goals().length === 0 && !error()) {
    <app-empty-state
      [fill]="true"
      image="assets/illustrations/get-started.svg"
      message="No goals yet - set a savings target and track your progress."
      cta="Add your first goal"
      (action)="addGoal()"
    />
  } @else {
    <app-segmented-toggle
      ariaLabel="Goal status"
      [options]="statusOptions"
      [(value)]="filter"
    />

    @if (filtered().length === 0) {
      <app-empty-state
        [fill]="true"
        image="assets/illustrations/get-started.svg"
        [message]="filter() === 'completed' ? 'No completed goals yet - keep saving!' : 'No goals in progress - add one to get started.'"
      />
    } @else {
      <ul class="rows">
        @for (g of filtered(); track g.id; let i = $index) {
          <li
            animate.enter="list-item-enter"
            [style.animation-delay]="(i < 12 ? i * 40 : 0) + 'ms'"
          >
            <app-goal-progress-row
              [name]="g.name"
              [currentMinor]="g.currentMinor"
              [targetMinor]="g.targetMinor"
              [currency]="g.currency"
              [completed]="g.completed"
              (edit)="editGoal(g)"
            />
          </li>
        }
      </ul>
    }
  }
</section>
