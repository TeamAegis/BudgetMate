[package]
name = "tauri-plugin-ocr"
version = "0.1.0"
description = "On-device OCR for BudgetMate - Apple Vision (iOS) / ML Kit (Android). Returns raw text + boxes only."
edition = "2021"
rust-version = "1.80"
# Required by tauri-plugin build: must equal package.name.
links = "tauri-plugin-ocr"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
