[package]
name = "budgetmate"
version = "0.1.0"
description = "BudgetMate (Vault) - strictly offline, privacy-first budget app"
authors = ["BudgetMate"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.80"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Keep the crate name `app_lib` so the mobile entry point and main.rs stay in sync.
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"

# Official Tauri plugins (desktop + mobile). Network plugins are deliberately absent.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Custom on-device OCR plugin (Apple Vision / ML Kit; native impl deferred - skeleton + Rust
# field extractor). Path dependency within this repo.
tauri-plugin-ocr = { path = "plugins/ocr" }

# Encrypted DB: SQLCipher compiled into the binary with a vendored OpenSSL crypto provider, so
# there is no system SQLite/crypto dependency and it cross-compiles to Android. NOT tauri-plugin-sql.
# Pinned to 0.37: rusqlite 0.40 pulls libsqlite3-sys 0.38, whose build script uses the unstable
# `cfg_select` feature and fails on stable Rust. 0.37 uses a libsqlite3-sys that builds on stable.
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }

# Money: integer minor units + rust_decimal for fx math. NEVER f32/f64 for money.
rust_decimal = { version = "1", features = ["serde-with-str"] }

# Crypto: passphrase KDF (Argon2id) + in-memory key zeroisation. `getrandom` (already pulled
# transitively) generates the per-install salt from the OS CSPRNG.
argon2 = "0.5"
zeroize = { version = "1", features = ["zeroize_derive"] }
getrandom = "0.3"

# Import / export (all pure-Rust, offline).
csv = "1"
rust_xlsxwriter = "0.95"

# Receipt field extraction + date handling (deterministic, no ML).
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"

# Android-only plugins: biometric unlock (FR-5.1) and Play-Store-safe SAF pickers + persistable
# URI permissions for backup/export (FR-4.x). `init()` for biometric is mobile-only.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-biometric = "2"
tauri-plugin-android-fs = "28"

[dev-dependencies]
rust_decimal_macros = "1"
# Property-based testing for the pure money/invariant logic (.claude/rules/engineering.md).
# Dev-only: adds no binary size.
proptest = "1"

# Size-optimised release profile (architecture.md §10.1 / NFR-Perf1).
[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1
opt-level = "z"
